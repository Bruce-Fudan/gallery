<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片集 · Gallery</title>
<style>
  :root {
    --bg: #f6f6f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #8a8a8e;
    --border: rgba(0, 0, 0, .07);
    --radius: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f11;
      --card: #1a1a1d;
      --text: #f2f2f4;
      --muted: #8e8e93;
      --border: rgba(255, 255, 255, .08);
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 56px 20px 88px;
  }

  /* ---------- 顶部标题 ---------- */
  header {
    margin-bottom: 44px;
  }

  header h1 {
    margin: 0 0 10px;
    font-size: clamp(24px, 4.2vw, 32px);
    font-weight: 700;
    letter-spacing: -.02em;
  }

  header p {
    margin: 0;
    font-size: 15px;
    color: var(--muted);
  }

  /* ---------- 网格布局 ---------- */
  .gallery {
    display: grid;
    grid-template-columns: 1fr;              /* 手机：一行一张 */
    gap: 22px;
  }

  @media (min-width: 620px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }   /* 平板：一行两张 */
  }

  @media (min-width: 1000px) {
    .gallery { grid-template-columns: repeat(3, 1fr); }   /* 电脑：一行三张 */
  }

  /* ---------- 卡片（纯静态，无悬停动效） ---------- */
  .card {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .thumb {
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: rgba(128, 128, 128, .12);
  }

  .thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ---------- 文字区域 ---------- */
  .caption {
    padding: 15px 17px 19px;
    flex: 1;
  }

  .title {
    margin: 0 0 5px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -.01em;
    line-height: 1.4;
  }

  .desc {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--muted);
  }

  /* 空标签时的浅灰占位提示，填上内容后自动消失 */
  .title:empty::before {
    content: "标题";
    font-weight: 400;
    color: var(--muted);
    opacity: .45;
  }

  .desc:empty::before {
    content: "说明文字";
    color: var(--muted);
    opacity: .45;
  }

  /* ---------- 页脚 ---------- */
  footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
