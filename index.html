<meta charset="UTF-8">

<title>图片集 · Gallery</title>
<style>
  :root {
    --bg: #f6f6f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #8a8a8e;
    --border: rgba(0, 0, 0, .07);
    --radius: 16px;
    --gap: 20px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f11;
      --card: #1a1a1d;
      --text: #f2f2f4;
      --muted: #8e8e93;
      --border: rgba(255, 255, 255, .08);
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 56px 20px 88px;
  }

  /* ---------- 顶部标题 ---------- */
  header { margin-bottom: 40px; }

  header h1 {
    margin: 0 0 10px;
    font-size: clamp(24px, 4.2vw, 32px);
    font-weight: 700;
    letter-spacing: -.02em;
  }

  header p {
    margin: 0;
    font-size: 15px;
    color: var(--muted);
  }

  /* ---------- 三列容器 ---------- */
  .gallery {
    display: flex;
    gap: var(--gap);
    align-items: flex-start;   /* 列各自独立，不互相拉伸 */
  }

  /* JS 就绪前先隐藏，避免卡片闪一下 */
  .preload .gallery { visibility: hidden; }

  .gallery .col {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  /* ---------- 卡片 ---------- */
  .card {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .thumb {
    background: rgba(128, 128, 128, .1);   /* 加载前的浅灰底 */
    font-size: 0;                          /* 消除 img 下方基线空隙 */
  }

  /* 宽度撑满列宽，高度 auto —— 保留原始比例，不裁剪 */
  .thumb img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ---------- 文字区域 ---------- */
  .caption { padding: 14px 16px 18px; }

  .title {
    margin: 0 0 5px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -.01em;
    line-height: 1.4;
  }

  .desc {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--muted);
  }

  /* 空标签时的浅灰占位提示，填上内容后自动消失 */
  .title:empty::before {
    content: "标题";
    font-weight: 400;
    color: var(--muted);
    opacity: .45;
  }

  .desc:empty::before {
    content: "说明文字";
    color: var(--muted);
    opacity: .45;
  }

  /* ---------- 页脚 ---------- */
  footer {
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>

  <script>
  (function () {
    var gallery = document.getElementById('gallery');

    // 保存原始卡片（按 HTML 里的顺序，也就是 1,2,3,4…）
    var cards = Array.prototype.slice.call(gallery.querySelectorAll('.card'));

    function getCols() {
      var w = window.innerWidth;
      if (w >= 1000) return 3;
      if (w >= 620)  return 2;
      return 1;
    }

    function layout() {
      var cols = getCols();

      // 清空
      gallery.innerHTML = '';

      // 建立 N 个列容器
      var colEls = [];
      for (var c = 0; c < cols; c++) {
        var col = document.createElement('div');
        col.className = 'col';
        gallery.appendChild(col);
        colEls.push(col);
      }

      // 按阅读顺序分配：第 i 张 → 第 (i % cols) 列
      cards.forEach(function (card, i) {
        colEls[i % cols].appendChild(card);
      });
    }

    // 首次排版
    layout();

    // JS 就绪，显示内容
    document.documentElement.classList.remove('preload');

    // 只在“列数变化”时重新排版，避免无谓抖动
    var lastCols = getCols();
    var timer = null;
    window.addEventListener('resize', function () {
      clearTimeout(timer);
      timer = setTimeout(function () {
        var nowCols = getCols();
        if (nowCols !== lastCols) {
          lastCols = nowCols;
          layout();
        }
      }, 120);
    });

    // 页脚年份
    var yearEl = document.getElementById('year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
  })();
  </script>
